<!DOCTYPE html>
<html lang="vi"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kiểm tra Shopee Affiliate Link</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; max-width: 900px; margin: 30px auto; padding: 20px; background: #f5f5f5; color: #222; }
    textarea { width: 100%; min-height: 130px; padding: 10px; font: inherit; resize: vertical; }
    button { margin-top: 10px; padding: 10px 18px; cursor: pointer; background: #ee4d2d; color: white; border: 0; border-radius: 4px; font: inherit; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; overflow-wrap: anywhere; }
    th { background: #ee4d2d; color: white; }
    .ok { color: green; font-weight: bold; }
    .no { color: red; font-weight: bold; }
  </style>
</head>
<body>
  <h2>Kiểm tra chỉ số Shopee Affiliate Link</h2>
  <textarea id="urlInput" placeholder="Dán link Shopee Affiliate vào đây..."></textarea>
  <br>
  <button id="checkButton" type="button">Kiểm tra</button>
  <div id="result"></div>

  <script>
    const input = document.getElementById("urlInput");
    const result = document.getElementById("result");

    document.getElementById("checkButton").addEventListener("click", checkLink);

    function checkLink() {
      const value = input.value.trim();
      result.replaceChildren();
      if (!value) return showMessage("Vui lòng nhập link.", "no");

      let url;
      try { url = new URL(value); }
      catch (error) { return showMessage("Link không hợp lệ.", "no"); }

      const params = url.searchParams;
      const data = {
        "Affiliate ID / PID": params.get("mmp_pid") || params.get("utm_source"),
        "UTM Source": params.get("utm_source"),
        "UTM Medium": params.get("utm_medium"),
        "Campaign": params.get("utm_campaign"),
        "Content / Sub nội dung": params.get("utm_content"),
        "Term / Sub tracking": params.get("utm_term"),
        "Product ID": getProductId(url.pathname),
        "Shop ID": getShopId(url.pathname),
        "Tracking ID": params.get("uls_trackid"),
        "Credential Token": params.get("credential_token")
      };

      appendHeading("Kết quả phân tích");
      const wrap = document.createElement("div");
      wrap.className = "table-wrap";
      const table = document.createElement("table");
      const header = table.insertRow();
      ["Chỉ số", "Giá trị", "Trạng thái"].forEach(label => {
        const cell = document.createElement("th");
        cell.textContent = label;
        header.appendChild(cell);
      });
      Object.entries(data).forEach(([label, item]) => {
        const row = table.insertRow();
        row.insertCell().textContent = label;
        row.insertCell().textContent = item || "-";
        const status = document.createElement("span");
        status.className = item ? "ok" : "no";
        status.textContent = item ? "Có" : "Không có";
        row.insertCell().appendChild(status);
      });
      wrap.appendChild(table);
      result.appendChild(wrap);

      appendHeading("Đánh giá nhanh");
      const isAffiliate = params.get("mmp_pid") || params.get("utm_medium") === "affiliates" || params.get("utm_source");
      showMessage(isAffiliate ? "Có dấu hiệu là link tiếp thị liên kết Shopee." : "Chưa thấy thông tin Affiliate rõ ràng.", isAffiliate ? "ok" : "no");
    }

    function appendHeading(text) {
      const heading = document.createElement("h3");
      heading.textContent = text;
      result.appendChild(heading);
    }

    function showMessage(text, className) {
      const paragraph = document.createElement("p");
      paragraph.className = className;
      paragraph.textContent = text;
      result.appendChild(paragraph);
    }

    function getProductId(pathname) {
      const match = pathname.match(/product\/\d+\/(\d+)/);
      return match ? match[1] : null;
    }

    function getShopId(pathname) {
      const match = pathname.match(/product\/(\d+)\/\d+/);
      return match ? match[1] : null;
    }
  </script>


</body></html>
